location /docker/ping {
    proxy_pass http://unix:/run/trim_docker_sm.sock;
}

location /docker/terminal {
    proxy_pass http://unix:/run/trim_docker_sm.sock;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP      $remote_addr;
    proxy_set_header Upgrade        $http_upgrade;
    proxy_set_header Connection     "upgrade";
    proxy_send_timeout 20m;
    proxy_read_timeout 20m;
}

location /docker/logs {
    proxy_pass http://unix:/run/trim_docker_sm.sock;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP      $remote_addr;
    proxy_set_header Upgrade        $http_upgrade;
    proxy_set_header Connection     "upgrade";
    proxy_send_timeout 20m;
    proxy_read_timeout 20m;
}

location /docker/imageUpload {
    proxy_pass http://unix:/run/trim_docker_sm.sock;
}

location /docker/images {
    expires 1h;
    alias /usr/trim/var/dockermgr/resources/images;
}