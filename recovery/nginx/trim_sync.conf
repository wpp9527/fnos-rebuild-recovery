location ~^/sync/(gendiff|gensign|genapply|delete|monitor|gendir|upload|rename|travel)/* {
        proxy_pass_request_headers on;
        proxy_pass http://unix:/var/run/trim_sync_server.sock;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header host       $host;
        proxy_read_timeout          7d;
        proxy_send_timeout          7d;
        client_body_timeout         7d; #bugfixed: pause timeout
        #keepalive_timeout           0;
        proxy_http_version          1.1;
        #proxy_buffering             off;
        proxy_request_buffering     off;
        client_body_buffer_size     512K;
        tcp_nopush                  on;
        proxy_max_temp_file_size    0;
}

location ^~/sync/event/register {
        proxy_pass http://unix:/var/run/trim_sync_server.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout          7d;
        proxy_send_timeout          7d;
        proxy_max_temp_file_size    0;
}


location ^~/fn-sync/ {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' '*';
        add_header 'Access-Control-Allow-Headers' '*';
        add_header 'Access-Control-Request-Private-Network' 'true';
        alias /usr/local/apps/@appcenter/trim.sync_server/ui/static/dist/;
        index index.html;
}