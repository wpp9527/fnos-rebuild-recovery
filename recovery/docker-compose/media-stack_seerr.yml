services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    network_mode: host
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Shanghai
      - PORT=5055
      - HTTP_PROXY=http://192.168.1.213:7890
      - HTTPS_PROXY=http://192.168.1.213:7890
      - NO_PROXY=localhost,127.0.0.1,192.168.1.0/24
    volumes:
      - /vol1/1000/docker/media-stack/seerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    user: "0:0"
    restart: unless-stopped
