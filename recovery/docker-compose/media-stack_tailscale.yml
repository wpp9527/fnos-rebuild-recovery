services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: fnos
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - /vol1/1000/docker/media-stack/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Asia/Shanghai
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
    restart: unless-stopped
