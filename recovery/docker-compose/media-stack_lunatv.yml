services:
  lunatv:
    image: ghcr.io/moontechlab/lunatv:latest
    container_name: lunatv
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      USERNAME: "bandas"
      PASSWORD: "wp930803"
      NEXT_PUBLIC_STORAGE_TYPE: "kvrocks"
      KVROCKS_URL: "redis://lunatv-kvrocks:6666"
      SITE_BASE: "https://lunatv.19930901.xyz:5000"
      NEXT_PUBLIC_SITE_NAME: "LunaTV"
      ANNOUNCEMENT: "仅供个人学习使用，请勿公开传播。"
      HTTP_PROXY: "http://192.168.1.213:7890"
      HTTPS_PROXY: "http://192.168.1.213:7890"
      NO_PROXY: "localhost,127.0.0.1,lunatv-kvrocks,192.168.0.0/16,172.16.0.0/12,10.0.0.0/8"
    depends_on:
      - lunatv-kvrocks
    networks:
      - lunatv-net

  lunatv-kvrocks:
    image: apache/kvrocks:latest
    container_name: lunatv-kvrocks
    restart: unless-stopped
    volumes:
      - ./kvrocks-data:/var/lib/kvrocks/db
    networks:
      - lunatv-net

networks:
  lunatv-net:
    driver: bridge

