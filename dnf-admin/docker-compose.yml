version: '3.8'

services:
  dnf-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dnf-admin
    restart: unless-stopped
    ports:
      - "18882:18882"
    environment:
      - SERVER_ID=local
      - SERVER_NAME=本地区
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DNF_DB_ROOT_PASSWORD}
      - DB_NAME=d_taiwan
      - JWT_SECRET=${JWT_SECRET:-dnf-admin-secret-key-change-this}
      - SERVER_PORT=18882
      - SERVERS_CONFIG=/app/multi-server/servers.json
    volumes:
      - ./multi-server:/app/multi-server
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dnf-admin-network

networks:
  dnf-admin-network:
    driver: bridge
