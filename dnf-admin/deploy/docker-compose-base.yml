version: '3.8'
services:
  mysql:
    image: mysql:5.7
    container_name: dnf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dnf_root_2026
      MYSQL_DATABASE: dnf_service
      MYSQL_USER: dnf_admin
      MYSQL_PASSWORD: dnf_admin_2026
    volumes:
      - ../data/mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    restart: unless-stopped
    networks:
      - dnf-network

  redis:
    image: redis:7-alpine
    container_name: dnf-redis
    command: redis-server --appendonly yes
    volumes:
      - ../data/redis:/data
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - dnf-network

networks:
  dnf-network:
    driver: bridge
