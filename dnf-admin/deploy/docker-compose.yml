version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dnf-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SERVER_PORT=8080
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-dnf_service}
      - DB_USER=${DB_USER:-readonly}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key}
      - PVF_SERVICE=http://pvf:5000
      - REDIS_ADDR=redis:6379
    depends_on:
      - mysql
      - pvf
      - redis
    restart: unless-stopped
    networks:
      - dnf-network

  pvf:
    build:
      context: ./pvf-service
      dockerfile: Dockerfile
    volumes:
      - ./data/pvf:/data/pvf
    ports:
      - "${PVF_PORT:-5000}:5000"
    restart: unless-stopped
    networks:
      - dnf-network

  mysql:
    image: mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${DB_NAME:-dnf_service}
      - MYSQL_USER=${DB_USER:-readonly}
      - MYSQL_PASSWORD=${DB_PASSWORD:-}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    restart: unless-stopped
    networks:
      - dnf-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - dnf-network

networks:
  dnf-network:
    driver: bridge
