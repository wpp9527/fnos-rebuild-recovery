# EasyTier 泰国可用配置
# 此配置已通过 EasyTier-web 数据库和命令行双重配置

instance_name = "bandas-home"
dhcp = true
listeners = [
    "tcp://0.0.0.0:11010",
    "udp://0.0.0.0:11010",
    "wg://0.0.0.0:11011",
    "ws://0.0.0.0:11011/",
    "wss://0.0.0.0:11012/",
]

[network_identity]
network_name = "bandas-home"
network_secret = "ETNet_7pQ9xL2mV8rK4sD1nW6cJ3hF5uA0zB"

# 公共中继服务器（全球可达）
[[peer]]
uri = "tcp://public.easytier.top:11010"

# 家节点直连（泰国到中国可能更快）
[[peer]]
uri = "tcp://27.12.175.221:11010"

# WebSocket 方式（某些网络环境更稳定）
[[peer]]
uri = "ws://27.12.175.221:11011/"

[flags]
default_protocol = "udp"
enable_encryption = true
enable_ipv6 = true
mtu = 1380
enable_kcp_proxy = true
enable_quic_proxy = true
private_mode = true
disable_p2p = false
disable_udp_hole_punching = false
disable_tcp_hole_punching = false

# 子网代理（让泰国设备访问整个局域网）
proxy_networks = "192.168.1.0/24"
