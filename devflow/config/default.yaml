# DevFlow 默认配置
# 减少人工介入的核心配置

# 项目默认设置
project:
  language: python
  framework: fastapi
  testing: pytest
  max_fix_rounds: 5
  auto_approve_architecture: true
  notify_on_complete: true
  notify_on_block: true
  notify_every_hour: false
  parallel_agents: 3
  timeout_per_phase: 3600  # 每阶段最长1小时

# 技术偏好（AI 自动决策时的默认值）
preferences:
  database: sqlite
  cache: none
  auth: jwt
  api_style: restful
  package_manager: pip
  code_style: black
  python_version: "3.11"

# Agent 配置
agents:
  pm:
    model: default
    max_retries: 3
    timeout: 300
  architect:
    model: default
    max_retries: 2
    timeout: 600
  developer:
    model: default
    max_retries: 5
    timeout: 1800
    parallel: true
  tester:
    model: default
    max_retries: 3
    timeout: 900
  reviewer:
    model: default
    max_retries: 2
    timeout: 600

# 纠错循环配置
error_handling:
  max_fix_rounds: 5
  retry_delay_seconds: 5
  escalate_on_failure: true
  auto_skip_on_block: true

# 通知配置
notifications:
  on_complete: true
  on_block: true
  on_phase_complete: false  # 不要每个阶段都通知
  progress_interval: 3600   # 进度报告间隔（秒）
